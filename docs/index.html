<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191f">
  <title>Άνοιγμα lobby</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #17191f; color: #f4f4f5; }
    main { width: min(90vw, 32rem); box-sizing: border-box; padding: 2rem; border: 1px solid #3b3e48; border-radius: 1rem; background: #22252d; text-align: center; }
    h1 { font-size: 1.5rem; }
    p { color: #c5c7ce; line-height: 1.55; }
    a { display: inline-block; margin-top: 1rem; padding: .9rem 1.2rem; border-radius: .6rem; background: #5865f2; color: white; font-weight: 700; text-decoration: none; }
    a:hover { background: #4752c4; }
    code { color: #d9dcff; }
    #error { color: #ffb4ab; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Άνοιγμα lobby</h1>
    <p id="details">Πάτησε το κουμπί για να ανοίξει το παιχνίδι στο lobby.</p>
    <p id="error" hidden>Ο σύνδεσμος δεν περιέχει έγκυρο Match ID.</p>
    <a id="open" href="#">Άνοιγμα στο παιχνίδι</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "";
    const game = params.get("game") || "aom";
    const steamLobbyId = params.get("steam_lobby_id") || "";
    const steamId = params.get("steam_id") || "";
    const appId = params.get("app_id") || "";
    const valid = /^[A-Za-z0-9_-]{1,64}$/.test(id);
    const validSteamLobbyId = /^\d{1,25}$/.test(steamLobbyId);
    const validSteamId = /^7656119\d{10}$/.test(steamId);
    const gameNames = { aom: "AoM", aoe2: "AoE2 DE", aoe3: "AoE3 DE", aoe4: "AoE4" };
    const supportedAppIds = { aom: "1934680", aoe2: "813780", aoe3: "933110", aoe4: "1466860" };
    const gameName = gameNames[game] || "παιχνιδιού";
    document.getElementById("heading").textContent = `Άνοιγμα ${gameName} lobby`;
    const link = document.getElementById("open");
    if (valid) {
      if (validSteamLobbyId) {
        const inviter = validSteamId ? `/${encodeURIComponent(steamId)}` : "";
        if (supportedAppIds[game] === appId) {
          link.href = `steam://joinlobby/${appId}/${encodeURIComponent(steamLobbyId)}${inviter}`;
          document.getElementById("details").innerHTML = `Lobby ID: <code>${id}</code>. Το Steam θα προσπαθήσει να ανοίξει το ${gameName} στο lobby.`;
        } else {
          link.hidden = true;
          document.getElementById("error").textContent = "Ο σύνδεσμος δεν περιέχει έγκυρο παιχνίδι.";
          document.getElementById("error").hidden = false;
        }
      } else if (game === "aom") {
        link.href = `mythde://${encodeURIComponent(id)}`;
        document.getElementById("details").innerHTML = `Match ID: <code>${id}</code>. Αν εμφανιστεί ερώτηση, επίλεξε να ανοίξει το Age of Mythology: Retold.`;
      } else if (game === "aoe2") {
        link.href = `aoe2de://0/${encodeURIComponent(id)}`;
        document.getElementById("details").innerHTML = `Lobby ID: <code>${id}</code>. Θα ανοίξει το AoE2 DE. Αν δεν ανοίξει αυτόματα, άνοιξε πρώτα το παιχνίδι.`;
      } else if (game === "aoe3") {
        link.href = `aoe3de://${encodeURIComponent(id)}`;
        document.getElementById("details").innerHTML = `Lobby ID: <code>${id}</code>. Θα ανοίξει το AoE3 DE. Αν δεν ανοίξει αυτόματα, άνοιξε πρώτα το παιχνίδι.`;
      } else {
        link.hidden = true;
        document.getElementById("error").textContent = "Δεν υπάρχει Steam Lobby ID για άμεση είσοδο.";
        document.getElementById("error").hidden = false;
      }
    } else {
      link.hidden = true;
      document.getElementById("error").hidden = false;
    }
  </script>
</body>
</html>
